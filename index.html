<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің алғашқы сайтым</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5; /* Жұмсақ ақшыл-қызғылт фон (LavenderBlush) */
            color: #4a2e35;            /* Қою күлгін-қызғылт мәтін түсі */
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #d81b60;            /* Қанық қызғылт тақырып */
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.15); /* Қызғылт реңкті көлеңке */
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #ffc1e3;   /* Блоктың сыртқы нәзік қызғылт жиегі */
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Сәлем, әлем! 🌸</h1>
        <p>Бұл GitHub Pages арқылы жасалған қызғылт дизайнды сайтым.</p>
    </div>
</body>
</html>
